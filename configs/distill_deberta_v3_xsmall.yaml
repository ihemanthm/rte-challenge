# Submission candidate: xsmall student distilled from the DeBERTa-v3-base teacher.
# Hyperparameters match student_deberta_v3_xsmall.yaml, so the distillation effect is isolated.
run_name: distill_deberta_v3_xsmall
model_name: microsoft/deberta-v3-xsmall
max_length: 256
seeds: [13, 21, 42, 87, 100]
epochs: 15
batch_size: 16
lr: 5.0e-5
head_lr: 1.0e-4
layer_decay: 0.9
weight_decay: 0.01
warmup_ratio: 0.1
val_fraction: 0.1
patience: 4
save_model: true
distill:
  teacher_logits: artifacts/teacher/teacher_logits_train.npy
  alpha: 0.5
  temperature: 2.0
